name: CI Language Course Matrix Engine

on:
  workflow_dispatch:
    inputs:
      lessons_csv:
        description: "Comma-separated unit IDs (required, e.g. U01,U02)"
        required: true
        type: string
      src_tag:
        description: "Ephemeral Release tag holding in_<UNIT>.zip input packs"
        required: true
        type: string
      shards_per_lesson:
        description: "Parallel shards per unit (default 6)"
        required: false
        default: "6"
      min_duration_sec:
        description: "Minimum master duration floor in seconds (7260 = 2h01m)"
        required: false
        default: "7260"
      hi_step:
        description: "Active-motion frame step (4 = 6fps)"
        required: false
        default: "4"
      lo_step:
        description: "Static frame step (24 = 1fps)"
        required: false
        default: "24"
      cleanup_src_tag:
        description: "Auto-delete ephemeral input release tag after build"
        required: false
        default: true
        type: boolean
      reuse_run_id:
        description: "Optional prior run_id to reuse already-synthesized stage-tpl & deliv artifacts"
        required: false
        default: ""
        type: string
      publish_public_release:
        description: "Keep public GitHub Release copy (disabled automatically when LC_BASE_URL is configured)"
        required: false
        default: false
        type: boolean
      src_repo:
        description: "Optional private repo owning src_tag (requires PRIVATE_ASSETS_PAT secret)"
        required: false
        default: ""
        type: string
      drive_target:
        description: "Optional @lokmane-cloud Drive ID or exact name (overrides LC_DRIVE_ID secret)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

jobs:
  plan:
    name: "0. Plan Parallel Matrix"
    runs-on: ubuntu-latest
    outputs:
      prepare_matrix: ${{ steps.mk.outputs.prepare_matrix }}
      shard_matrix: ${{ steps.mk.outputs.shard_matrix }}
      num_shards: ${{ steps.mk.outputs.num_shards }}
      has_lc: ${{ steps.mk.outputs.has_lc }}
    steps:
      - id: mk
        env:
          LESSONS_CSV: ${{ inputs.lessons_csv }}
          SHARDS_N: ${{ inputs.shards_per_lesson }}
          HAS_KEYS: ${{ secrets.AISTUDIO_KEYS_JSON != '' || secrets.AEGIS_BASE_URL != '' }}
          HAS_LC: ${{ secrets.LC_BASE_URL != '' && secrets.LC_USERNAME != '' && secrets.LC_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYS" != "true" ]; then
            echo "::error::Missing AISTUDIO_KEYS_JSON or AEGIS_BASE_URL secret."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          lessons = [x.strip() for x in os.environ["LESSONS_CSV"].split(",") if x.strip()]
          if not lessons:
              raise SystemExit("No unit IDs supplied in lessons_csv.")
          n_shards = max(1, min(16, int(os.environ.get("SHARDS_N") or 8)))
          prep = [{"lesson": u} for u in lessons]
          shards = [
              {"lesson": u, "shard": s, "num_shards": n_shards}
              for u in lessons
              for s in range(1, n_shards + 1)
          ]
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("prepare_matrix=" + json.dumps({"include": prep}, separators=(",", ":")) + "\n")
              fh.write("shard_matrix=" + json.dumps({"include": shards}, separators=(",", ":")) + "\n")
              fh.write(f"num_shards={n_shards}\n")
              fh.write(f"has_lc={os.environ.get('HAS_LC', 'false')}\n")
          print(f"Planned {len(prep)} unit prepare jobs and {len(shards)} parallel 1080p shards (lokmane_cloud={os.environ.get('HAS_LC')}).")
          PY

  prepare:
    name: "1. Audio + Podcast + PDF (${{ matrix.lesson }})"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.prepare_matrix) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRIVATE_ASSETS_PAT: ${{ secrets.PRIVATE_ASSETS_PAT }}
      AISTUDIO_KEYS_JSON: ${{ secrets.AISTUDIO_KEYS_JSON }}
      AISTUDIO_ARTIFACT_KEY: ${{ secrets.AISTUDIO_ARTIFACT_KEY }}
      AEGIS_BASE_URL: ${{ secrets.AEGIS_BASE_URL }}
      UNIT_ID: ${{ matrix.lesson }}
      SRC_TAG: ${{ inputs.src_tag }}
      SRC_REPO: ${{ inputs.src_repo }}
      MIN_SEC: ${{ inputs.min_duration_sec }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Try Reusing Prior Prepared Artifacts (If Supplied)
        id: reuse
        run: |
          if [ -n "$REUSE_RUN_ID" ]; then
            mkdir -p work/tpl work/deliv
            if gh run download "$REUSE_RUN_ID" --repo "${{ github.repository }}" -n "stage-tpl-${UNIT_ID}-${REUSE_RUN_ID}" -D work/tpl 2>/dev/null && \
               gh run download "$REUSE_RUN_ID" --repo "${{ github.repository }}" -n "deliv-${UNIT_ID}-${REUSE_RUN_ID}" -D work/deliv 2>/dev/null; then
              find work/tpl -mindepth 2 -type f -exec mv -t work/tpl {} + 2>/dev/null || true
              find work/deliv -mindepth 2 -type f -exec mv -t work/deliv {} + 2>/dev/null || true
              if [ -f work/tpl/stage-tpl.tar.enc ]; then
                if [ -z "$AISTUDIO_ARTIFACT_KEY" ]; then
                  echo "::error::Encrypted artifact found but AISTUDIO_ARTIFACT_KEY secret is missing."
                  exit 1
                fi
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:AISTUDIO_ARTIFACT_KEY -in work/tpl/stage-tpl.tar.enc | tar -C work/tpl -xf -
                rm -f work/tpl/stage-tpl.tar.enc
              fi
              if [ -f work/deliv/deliv.tar.enc ]; then
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:AISTUDIO_ARTIFACT_KEY -in work/deliv/deliv.tar.enc | tar -C work/deliv -xf -
                rm -f work/deliv/deliv.tar.enc
              fi
              echo "Reused existing prepared bundle for ${UNIT_ID} from run ${REUSE_RUN_ID}!"
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -rf work/tpl work/deliv
          fi
          echo "reused=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.reuse.outputs.reused != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Multilingual Fonts (Arabic + Latin)
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL --connect-timeout 8 --max-time 25 "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o ~/.local/share/fonts/Cairo.ttf || true
          curl -fsSL --connect-timeout 8 --max-time 25 "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" -o ~/.local/share/fonts/Amiri-Regular.ttf || true
          curl -fsSL --connect-timeout 8 --max-time 25 "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" -o ~/.local/share/fonts/Amiri-Bold.ttf || true
          fc-cache -f || true

      - name: Install Python Deps & Chromium
        if: steps.reuse.outputs.reused != 'true'
        run: |
          pip install --quiet playwright imageio-ffmpeg numpy pillow "edge-tts>=7.2.7" piper-tts
          playwright install chromium
          playwright install-deps chromium

      - name: Cache Offline Multilingual Piper Voices
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: work/piper_voices
          key: piper-de-ar-v1

      - name: Ensure Offline Piper DE & AR Models
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p work/piper_voices
          if [ ! -f work/piper_voices/de_DE-thorsten-low.onnx ]; then
            curl -fsSL --connect-timeout 10 --max-time 60 "https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/low/de_DE-thorsten-low.onnx" -o work/piper_voices/de_DE-thorsten-low.onnx || true
            curl -fsSL --connect-timeout 10 --max-time 30 "https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/low/de_DE-thorsten-low.onnx.json" -o work/piper_voices/de_DE-thorsten-low.onnx.json || true
          fi
          if [ ! -f work/piper_voices/ar_JO-kareem-low.onnx ]; then
            curl -fsSL --connect-timeout 10 --max-time 60 "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/low/ar_JO-kareem-low.onnx" -o work/piper_voices/ar_JO-kareem-low.onnx || true
            curl -fsSL --connect-timeout 10 --max-time 30 "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/low/ar_JO-kareem-low.onnx.json" -o work/piper_voices/ar_JO-kareem-low.onnx.json || true
          fi

      - name: Download & Unpack Ephemeral Unit Bundle
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p work/dl work/assets work/tpl work/deliv
          if [ -n "$SRC_REPO" ] && [ -n "$PRIVATE_ASSETS_PAT" ]; then
            GH_TOKEN="$PRIVATE_ASSETS_PAT" gh release download "$SRC_TAG" --repo "$SRC_REPO" --pattern "in_${UNIT_ID}.zip" --dir work/dl
          else
            gh release download "$SRC_TAG" --pattern "in_${UNIT_ID}.zip" --dir work/dl
          fi
          python3 -m zipfile -e "work/dl/in_${UNIT_ID}.zip" work/assets
          rm -rf work/dl

      - name: Build Workbook PDF + 2H+ Bilingual Audio + Rapid Podcast + Stage + Previews
        if: steps.reuse.outputs.reused != 'true'
        run: |
          python -m aegis_studio.lang_workbook_worker \
            --curriculum work/assets/curriculum.json \
            --out "work/deliv/${UNIT_ID}_Workbook.pdf"

          python -m aegis_studio.lang_audio_worker \
            --curriculum work/assets/curriculum.json \
            --assets-dir work/assets \
            --out-dir work/bundle \
            --fps 24 \
            --workers 5 \
            --min-sec "$MIN_SEC" \
            --no-full-mp3 \
            --piper-dir work/piper_voices

          python -m aegis_studio.lang_stage_worker \
            --timeline work/bundle/timeline.json \
            --assets-dir work/assets \
            --rms work/bundle/rms_per_frame.json \
            --out work/tpl/stage.html

          python -m aegis_studio.lang_shard_worker \
            --smoke \
            --stage-html work/tpl/stage.html \
            --timeline work/bundle/timeline.json \
            --out work/smoke_previews

          (cd work/smoke_previews && zip -q -r "../deliv/${UNIT_ID}_smoke_previews.zip" .)
          cp work/bundle/timeline.json work/tpl/timeline.json
          cp work/bundle/master_2h.m4a work/deliv/master_2h.m4a
          cp "work/bundle/${UNIT_ID}_Rapid_Fluency_Podcast.mp3" "work/deliv/${UNIT_ID}_Rapid_Fluency_Podcast.mp3"
          cp work/bundle/subtitles.ass work/bundle/subtitles.srt work/bundle/chapters.txt work/deliv/
          rm -rf work/bundle work/assets work/smoke_previews

      - name: Seal Ephemeral Pipeline Artifacts (AES-256 When Key Configured)
        run: |
          mkdir -p work/art_tpl work/art_deliv
          if [ -n "$AISTUDIO_ARTIFACT_KEY" ]; then
            tar -C work/tpl -cf - . | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:AISTUDIO_ARTIFACT_KEY -out work/art_tpl/stage-tpl.tar.enc
            tar -C work/deliv -cf - . | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:AISTUDIO_ARTIFACT_KEY -out work/art_deliv/deliv.tar.enc
            rm -rf work/tpl work/deliv
          else
            cp -a work/tpl/. work/art_tpl/
            cp -a work/deliv/. work/art_deliv/
          fi

      - name: Upload Compact Stage Template for Shards
        uses: actions/upload-artifact@v4
        with:
          name: stage-tpl-${{ matrix.lesson }}-${{ github.run_id }}
          path: work/art_tpl/
          retention-days: 1

      - name: Upload Deliverables Bundle for Merge
        uses: actions/upload-artifact@v4
        with:
          name: deliv-${{ matrix.lesson }}-${{ github.run_id }}
          path: work/art_deliv/
          retention-days: 1

  render-shard:
    name: "2. 1080p Shard (${{ matrix.lesson }} #${{ matrix.shard }}/${{ matrix.num_shards }})"
    needs: [plan, prepare]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.shard_matrix) }}
    env:
      HI_STEP: ${{ inputs.hi_step }}
      LO_STEP: ${{ inputs.lo_step }}
      AISTUDIO_ARTIFACT_KEY: ${{ secrets.AISTUDIO_ARTIFACT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Multilingual Fonts
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL --connect-timeout 8 --max-time 25 "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o ~/.local/share/fonts/Cairo.ttf || true
          curl -fsSL --connect-timeout 8 --max-time 25 "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" -o ~/.local/share/fonts/Amiri-Regular.ttf || true
          curl -fsSL --connect-timeout 8 --max-time 25 "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" -o ~/.local/share/fonts/Amiri-Bold.ttf || true
          fc-cache -f || true

      - name: Cache Playwright Browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-ubuntu-chromium-v1

      - name: Install Playwright & Chromium
        run: |
          pip install --quiet playwright imageio-ffmpeg
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          playwright install-deps chromium

      - name: Download & Unseal Compact Stage Template
        uses: actions/download-artifact@v4
        with:
          name: stage-tpl-${{ matrix.lesson }}-${{ github.run_id }}
          path: work/tpl

      - name: Decrypt Stage Template If Sealed
        run: |
          if [ -f work/tpl/stage-tpl.tar.enc ]; then
            if [ -z "$AISTUDIO_ARTIFACT_KEY" ]; then
              echo "::error::Encrypted stage-tpl found but AISTUDIO_ARTIFACT_KEY secret is missing."
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:AISTUDIO_ARTIFACT_KEY -in work/tpl/stage-tpl.tar.enc | tar -C work/tpl -xf -
            rm -f work/tpl/stage-tpl.tar.enc
          fi

      - name: Render 1080p Adaptive Shard
        run: |
          SHARD_PAD=$(printf "%02d" "${{ matrix.shard }}")
          NUM_PAD=$(printf "%02d" "${{ matrix.num_shards }}")
          mkdir -p work/shards
          OUT_MP4="work/shards/shard_${SHARD_PAD}_of_${NUM_PAD}.mp4"
          python -m aegis_studio.lang_shard_worker \
            --stage-html work/tpl/stage.html \
            --timeline work/tpl/timeline.json \
            --shard "${{ matrix.shard }}" \
            --num-shards "${{ matrix.num_shards }}" \
            --hi-step "$HI_STEP" \
            --lo-step "$LO_STEP" \
            --crf 21 \
            --preset veryfast \
            --out "$OUT_MP4"
          if [ -n "$AISTUDIO_ARTIFACT_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:AISTUDIO_ARTIFACT_KEY -in "$OUT_MP4" -out "${OUT_MP4}.enc"
            rm -f "$OUT_MP4"
          fi

      - name: Upload Shard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.lesson }}-${{ matrix.shard }}-${{ github.run_id }}
          path: work/shards/
          retention-days: 1

  merge:
    name: "3. Merge & Direct Drive Publish (${{ matrix.lesson }})"
    needs: [plan, render-shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.render-shard.result == 'success' || needs.render-shard.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.prepare_matrix) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AISTUDIO_ARTIFACT_KEY: ${{ secrets.AISTUDIO_ARTIFACT_KEY }}
      LC_BASE_URL: ${{ secrets.LC_BASE_URL }}
      LC_USERNAME: ${{ secrets.LC_USERNAME }}
      LC_PASSWORD: ${{ secrets.LC_PASSWORD }}
      LC_DRIVE_ID: ${{ secrets.LC_DRIVE_ID }}
      LC_DRIVE_OVERRIDE: ${{ inputs.drive_target }}
      LC_ROOT_FOLDER: ${{ secrets.LC_ROOT_FOLDER }}
      UNIT_ID: ${{ matrix.lesson }}
      NUM_SHARDS: ${{ needs.plan.outputs.num_shards }}
      MIN_SEC: ${{ inputs.min_duration_sec }}
      PUB_REL: ${{ inputs.publish_public_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Helper
        run: pip install --quiet imageio-ffmpeg

      - name: Download Deliverables Bundle
        uses: actions/download-artifact@v4
        with:
          name: deliv-${{ matrix.lesson }}-${{ github.run_id }}
          path: work/deliv

      - name: Download Rendered Shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.lesson }}-*-${{ github.run_id }}
          path: work/shards
          merge-multiple: true

      - name: Unseal Deliverables & Shards, Merge 2H+ Master & Upload
        run: |
          if [ -f work/deliv/deliv.tar.enc ]; then
            if [ -z "$AISTUDIO_ARTIFACT_KEY" ]; then
              echo "::error::Encrypted deliv bundle found but AISTUDIO_ARTIFACT_KEY secret is missing."
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:AISTUDIO_ARTIFACT_KEY -in work/deliv/deliv.tar.enc | tar -C work/deliv -xf -
            rm -f work/deliv/deliv.tar.enc
          fi
          shopt -s nullglob
          for encf in work/shards/*.mp4.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:AISTUDIO_ARTIFACT_KEY -in "$encf" -out "${encf%.enc}"
            rm -f "$encf"
          done
          shopt -u nullglob

          mkdir -p work/out
          python -m aegis_studio.lang_shard_worker \
            --merge \
            --shards-dir work/shards \
            --audio work/deliv/master_2h.m4a \
            --num-shards "$NUM_SHARDS" \
            --min-sec "$MIN_SEC" \
            --out "work/out/${UNIT_ID}_2H_Master.mp4"

          cp "work/deliv/${UNIT_ID}_Workbook.pdf" work/out/
          cp "work/deliv/${UNIT_ID}_Rapid_Fluency_Podcast.mp3" work/out/
          cp "work/deliv/${UNIT_ID}_smoke_previews.zip" work/out/
          cp work/deliv/subtitles.ass work/deliv/subtitles.srt work/deliv/chapters.txt work/out/

          UPLOADED_TO_LC="false"
          if [ -n "$LC_BASE_URL" ] && [ -n "$LC_USERNAME" ] && [ -n "$LC_PASSWORD" ]; then
            python -m aegis_studio.lokmane_cloud_uploader upload-dir \
              --unit "$UNIT_ID" \
              --dir work/out \
              --root-folder "$LC_ROOT_FOLDER"
            UPLOADED_TO_LC="true"
          fi
          echo "UPLOADED_TO_LC=${UPLOADED_TO_LC}" >> "$GITHUB_ENV"

          if [ "$UPLOADED_TO_LC" != "true" ] || [ "$PUB_REL" = "true" ]; then
            RAND_HEX=$(python3 -c "import secrets; print(secrets.token_hex(4))")
            SLUG=$(echo "$UNIT_ID" | tr '[:upper:]_' '[:lower:]-')
            TAG="pkg-${SLUG}-${{ github.run_id }}-${RAND_HEX}"
            gh release create "$TAG" \
              "work/out/${UNIT_ID}_2H_Master.mp4" \
              "work/out/${UNIT_ID}_Workbook.pdf" \
              "work/out/${UNIT_ID}_Rapid_Fluency_Podcast.mp3" \
              "work/out/${UNIT_ID}_smoke_previews.zip" \
              work/out/subtitles.ass \
              work/out/subtitles.srt \
              work/out/chapters.txt \
              --title "build-${SLUG}-${{ github.run_id }}" \
              --notes "Compiled unit deliverables ${RAND_HEX}"
            echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          else
            rm -rf work/out work/shards work/deliv
            echo "Zero-leak mode active: deliverables stored privately on Google Drive via @lokmane-cloud (no public release created)."
          fi

      - name: Upload Compact Companion Artifact (Only When Not Stored Privately on Drive)
        if: env.UPLOADED_TO_LC != 'true' || inputs.publish_public_release == true
        uses: actions/upload-artifact@v4
        with:
          name: companions-${{ matrix.lesson }}-${{ github.run_id }}
          path: |
            work/out/*.pdf
            work/out/*.mp3
            work/out/*.zip
            work/out/*.ass
            work/out/*.srt
            work/out/*.txt
          retention-days: 14

  cleanup-inputs:
    name: "4. Purge Ephemeral Inputs & Temp Run Artifacts"
    needs: [prepare, render-shard, merge]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRIVATE_ASSETS_PAT: ${{ secrets.PRIVATE_ASSETS_PAT }}
      SRC_TAG: ${{ inputs.src_tag }}
      SRC_REPO: ${{ inputs.src_repo }}
      CLEAN_SRC: ${{ inputs.cleanup_src_tag }}
    steps:
      - name: Purge Ephemeral Input Tag If Requested
        run: |
          if [ "$CLEAN_SRC" = "true" ] && [ -n "$SRC_TAG" ]; then
            if [ -n "$SRC_REPO" ] && [ -n "$PRIVATE_ASSETS_PAT" ]; then
              GH_TOKEN="$PRIVATE_ASSETS_PAT" gh release delete "$SRC_TAG" --repo "$SRC_REPO" --cleanup-tag --yes || true
            else
              gh release delete "$SRC_TAG" --repo "${{ github.repository }}" --cleanup-tag --yes || true
            fi
            echo "Purged ephemeral input tag: $SRC_TAG"
          fi

      - name: Purge Temporary Stage, Deliverable & Shard Artifacts
        run: |
          IDS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name | test("^(stage-tpl|deliv|shard)-")) | .id' || true)
          CNT=0
          for aid in $IDS; do
            if [ -n "$aid" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${aid}" >/dev/null || true
              CNT=$((CNT + 1))
            fi
          done
          echo "Purged ${CNT} temporary run artifacts."
